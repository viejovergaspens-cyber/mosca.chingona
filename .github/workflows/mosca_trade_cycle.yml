name: Mosca trade cycle

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}   # permite tambien correrlo a mano desde la pestaña Actions de GitHub

jobs:
  cycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Correr un ciclo de trading
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: python mosca_firestore.py cycle
